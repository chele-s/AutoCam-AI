stream:
  input_url: "test_pro_4k_final.mp4"
  output_url: "rtmp://localhost/live/output"
  target_fps: 20
  bitrate: "4000k"
  preset: "ultrafast"
  show_stats: true
  debug_mode: false

output:
  width: 4608
  height: 1728

processing:
  detection_width: 1920
  detection_height: 1080

camera:
  base_output_width: 4608
  base_output_height: 1728
  dead_zone: 0.10
  anticipation: 0.35
  zoom_padding: 1.2
  smoothing_freq: 30.0
  smoothing_min_cutoff: 2.5
  smoothing_beta: 0.001

zoom_control:
  max_zoom_level: 1.8
  frames_required_for_zoom: 4
  stiffness: 0.060
  damping: 0.60
  max_rate: 0.11
  max_rate_in: 0.14
  max_rate_out: 0.10
  accel_limit: 0.05
