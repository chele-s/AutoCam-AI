model:
  path: "models/checkpoint_best_total.pth"  # ONNX model for 1.5-2x speedup
  confidence: 0.45
  iou_threshold: 0.45
  device: "cuda"
  half_precision: true
  imgsz: 1920
  multi_scale: false
  warmup_iterations: 3
  ball_class_id: 1

tracking:
  max_lost_frames: 15
  min_confidence: 0.50
  iou_threshold: 0.15
  history_size: 30

  # Advanced Tracking Parameters (Factors of frame width/height)
  vertical_jump_limit_factor: 0.14
  jump_threshold_factor: 0.13
  jitter_min_factor: 0.008
  jitter_max_factor: 0.031
  large_jump_factor: 0.0625
  erratic_variance_factor: 0.012
  erratic_mean_factor: 0.036
